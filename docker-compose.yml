# Sobe tudo numa VM só: banco, painel, worker de disparo e HTTPS automático.
#   cp .env.example .env   (preencha)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fuzil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuzil}
      POSTGRES_DB: fuzil
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuzil"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: fuzil-disparador:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fuzil:${POSTGRES_PASSWORD:-fuzil}@db:5432/fuzil
      UPLOAD_DIR: /data/uploads
      # Teto de memória do Node: nunca deixa o painel tomar a VM inteira (e derrubar o banco)
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: fuzil-disparador:latest
    pull_policy: never
    restart: unless-stopped
    # Worker já empacotado (bem mais leve que rodar pelo tsx/npx)
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && exec node dist/worker.mjs"]
    init: true
    stop_grace_period: 60s
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fuzil:${POSTGRES_PASSWORD:-fuzil}@db:5432/fuzil
      UPLOAD_DIR: /data/uploads
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - uploads:/data/uploads
    depends_on:
      - app

  # E-mails do domínio (só recebe): a porta 25 da VM cai aqui e os e-mails vão para a aba E-mails do Fuzil
  mail:
    image: fuzil-disparador:latest
    pull_policy: never
    restart: unless-stopped
    command: ["node", "dist/mail.mjs"]
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fuzil:${POSTGRES_PASSWORD:-fuzil}@db:5432/fuzil
      UPLOAD_DIR: /data/uploads
      NODE_OPTIONS: --max-old-space-size=192
    ports:
      - "25:2525"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - worker

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Monta a pasta deploy (não o arquivo solto) para o Caddy sempre enxergar o Caddyfile atualizado
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./deploy:/etc/caddy/conf:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
